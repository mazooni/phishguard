# Fly.io configuration for the PhishGuard relay.
# SQLite lives on a per-machine volume, so run exactly ONE machine (`fly scale count 1`);
# volumes cannot be shared and `fly machine clone` does not copy data.

app = "phishguard-relay"   # your Fly app name
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  DEBOUNCE_SECONDS = "10"
  # PUBLIC_BASE_URL, APNS_BUNDLE_ID, PUBSUB_SERVICE_ACCOUNT_EMAIL and PUBSUB_AUDIENCE are not secrets and can
  # live here too; the README sets them with `fly secrets set` alongside the real secrets for simplicity.

[http_service]
  internal_port = 8080
  force_https = true
  # Webhooks must always be reachable: never stop the machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "relay_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
